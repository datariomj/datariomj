<!-- Hero Header -->
<header class="mb-4">
  <div class="inline-block px-2 py-1 bg-surface-container border border-border-hairline mb-4">
    <span class="font-jetbrains text-xs text-primary tracking-wider">0x02 // DEPLOYMENT_LOGS</span>
  </div>
  <h1 class="font-jetbrains text-3xl md:text-5xl font-bold text-text-crisp mb-4 tracking-tighter leading-tight">THE JOURNEY</h1>
  <p class="text-lg text-text-muted max-w-xl leading-relaxed">
    A chronological trace of infrastructure deployments, systems architecture, and site reliability engineering across high-stakes fintech environments.
  </p>
  <div class="mt-8">
    <app-terminal-hero></app-terminal-hero>
  </div>
</header>

<!-- Experience Grid -->
<section id="experience" class="pt-4 md:pt-8 w-full max-w-5xl mx-auto">
  <div class="border-l border-border-hairline ml-2 pl-6 relative flex flex-col gap-10">
    @for (exp of experiences; track exp.company) {
      <div class="relative group">
        <div
          class="absolute -left-[31px] top-1 w-3 h-3 rounded-full border-4 border-background transition-colors content-box"
          [ngClass]="exp.isCurrent ? 'bg-primary animate-[pulse-dot_2s_cubic-bezier(0.4,0,0.6,1)_infinite]' : 'bg-border-hairline group-hover:bg-text-muted'">
        </div>
        <app-experience-block
          [title]="exp.title"
          [company]="exp.company"
          [location]="exp.location"
          [badge]="exp.badge"
          [dateRange]="exp.dateRange"
          [items]="exp.items"
          [technologies]="exp.technologies"
          [isCurrent]="exp.isCurrent">
        </app-experience-block>
      </div>
    }
  </div>
</section>
