    @for (link of navigationLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active-link" (click)="closeMenu()" class="mobile-dropdown-link">[{{link.label}}]</a>

<nav class="sidenav__mobile-nav mobile-only" role="navigation" aria-label="Mobile navigation">

    <i class="fa-solid fa-terminal"></i>
    <span>home</span>

  @for (link of navigationLinks; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="mobile-nav-active" class="mobile-nav-item" (click)="closeMenu()">
